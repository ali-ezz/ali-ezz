name: star of the day

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  star:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install Pillow
      - run: python scripts/daily.py
      - name: commit the new star
        run: |
          git diff --quiet -- assets && exit 0
          git config user.name "Ali Alyan"
          git config user.email "ali.ezz617@gmail.com"
          git add assets/desk-star.webp assets/phone-star.webp
          git commit -m "Update star of the day"
          git push
